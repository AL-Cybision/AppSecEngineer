name: DAST

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait
      - run: curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/health
      - uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6 # v0.14.0
        with:
          target: http://127.0.0.1:8000
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report
      - if: always()
        run: docker compose logs --no-color > compose.log && docker compose down --volumes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dast-runtime-log
          path: compose.log
          retention-days: 7

